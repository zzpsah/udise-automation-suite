name: Isolated UDISE UI Preview (GitHub Pages)
# Deploys only the isolated static UI preview; Vercel production is not used.
# Publishes only the static preview/ directory; never deploys Vercel.

on:
  push:
    branches:
      - ui-preview-pages
    paths:
      - "preview/**"
      - ".github/workflows/ui-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: udise-ui-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Prepare static preview artifact
        run: |
          test -s preview/index.html
          mkdir -p _site
          cp preview/index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
