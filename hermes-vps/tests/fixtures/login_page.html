<!DOCTYPE html>
<html>
<head>
    <title>Sign In - UDISE+</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico"/>
    <link rel="stylesheet" href="/css/login.css"/>
    <link rel="stylesheet" href="/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/bootstrap-icons.css"/>
    <link rel="stylesheet" href="/css/auth-theme.css"/>
    <script type="text/javascript" src="/js/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="/js/crypto-js.min.js"></script>
    <script type="text/javascript" src="/js/login.js"></script>
</head>

<body class="auth-page login-page">
<div class="container">
    <div class="login-wrapper">
    <div class="header">
        <div>
            <img src="/images/udise-logo.svg"
                 alt="Government of India">
        </div>
    </div>
        <div class="form-container">
            <div class="text-center mb-4">
                <h1 class="title">Sign in</h1>
                <h6 class="text-center mt-2">
                    to continue to <span class="client-name">UDISE+ SDMS</span>
                </h6>
            </div>

        
        
        
        
        
        
        
        
        
        

            <div id="sessionTimeoutAlert" class="session-timeout-warning">
                Your login page has expired due to inactivity.
                <a href="#" id="refreshLink">Refresh Page</a>
            </div>

        <form action="/login" method="post" class="login-form" autocomplete="off"><input type="hidden" name="_csrf" value="TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"/>
            <input type="hidden" name="loginTxnId" value="00000000-0000-4000-8000-000000000000">
            <input type="hidden" name="_csrf" value="TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT" />
            <input type="hidden" value="/" id="ctx-path"/>
            <input type="hidden" value="900" id="sessionTimeout"/>
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" id="username" name="username" class="form-input"
                           placeholder="Enter your username" minlength="4" maxlength="20"
                           autocomplete="new-password" autocapitalize="none" spellcheck="false" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <circle cx="12" cy="16" r="1"></circle>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input id="password" name="password" class="form-input"
                           placeholder="Enter your Password" type="password" autocomplete="new-password"
                           minlength="4" maxlength="20" required>
                    <button type="button" class="password-toggle" id="passwordToggle"
                            aria-label="Show password" aria-pressed="false">
                        <svg class="eye-icon eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-icon eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5.5 19 2 12 2 12a20.29 20.29 0 0 1 5.06-5.94"></path>
                            <path d="M9.9 4.24A10.66 10.66 0 0 1 12 4.99C18.5 5 22 12 22 12a20.46 20.46 0 0 1-2.16 3.19"></path>
                            <path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path>
                            <path d="M1 1l22 22"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label  class="form-label">Captcha</label>
                <div class="captcha-mode" role="radiogroup" aria-label="Captcha type">
                    <label>
                        <input type="radio" name="captchaMode" value="image" checked>
                        <span>Image</span>
                    </label>
                    <label>
                        <input type="radio" name="captchaMode" value="audio">
                        <span>Audio</span>
                    </label>
                </div>
                <div class="captcha-container">
                    <div class="captcha-display" id="captchaImageBox">
                        <img src="/captcha-image" alt="CAPTCHA" class="captcha-text" id="captchaImage"/>
                    </div>
                    <div class="captcha-audio-display" id="captchaAudioBox" hidden>
                        <audio id="captchaAudio" controls preload="none"></audio>
                    </div>
                    <button type="button" class="captcha-refresh captcha-refresh-btn" id="captchaRefresh">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw w-5 h-5" data-source-location="components/CaptchaField:123:10" data-dynamic-content="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
                    </button>
                </div>
                <div class="input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check w-4 h-4 shrink-0 text-gray-400 input-icon" data-source-location="components/CaptchaField:132:8" data-dynamic-content="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>
                    <input type="text" name="captcha" placeholder="Enter captcha code"  class="form-input" autocomplete="off" minlength="6" maxlength="6" required />
                </div>
            </div>
            <div class="forgot-password">
                <a href="https://udiseplus.gov.in/account/#/forgot-password?redirect=https%3A%2F%2Fauth.udiseplus.gov.in%2Flogin%3Fresponse_type%3Dcode%26client_id%3Dudise-sdms-g0%26scope%3Dread%2520user_info%26state%3D965bdf32-3e8e-4cd9-b108-cf17a9ee036d%26redirect_uri%3Dhttps%3A%2F%2Fsdms.udiseplus.gov.in%2Fp0%2Foauth2%2Fcallback%26loginTxnId%3D00000000-0000-4000-8000-000000000000" class="forgot-link">Forgot Password?</a>
            </div>
            <button type="submit"  class="submit-btn" id="loginBtn">Sign In</button>
            <input type="hidden" id="lockDuration" value=""/>
            <input type="hidden" id="lockExpiresAtMillis" value=""/>
        </form>
    </div>
</div>
</div>
</body>
</html>
